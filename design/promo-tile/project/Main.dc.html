<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wishlist+ marquee promo tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#e6f1fc}
</style>
</helmet>
<div style="width: 1400px; height: 560px; position: relative; overflow: hidden; box-sizing: border-box; background: {{blue}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ffffff">

  <div aria-hidden="true" style="position: absolute; left: 600px; top: -140px; width: 980px; height: 860px; border-radius: 120px; background: #0A6AC6; transform: rotate(-12deg)"></div>
  <div aria-hidden="true" style="position: absolute; left: -160px; top: 380px; width: 420px; height: 420px; border-radius: 80px; border: 2px solid rgba(255,255,255,0.10); transform: rotate(18deg)"></div>

  <div style="position: absolute; left: 812px; top: 34px; width: 620px; height: 373px; border-radius: 16px; overflow: hidden; background: #ffffff; box-shadow: 0 24px 60px rgba(0,30,70,0.35); transform: rotate(5deg); opacity: 0.9">
    <img src="/_blob/23d2fe14c4cd255f6eaaa0cfd95bfa80" alt="List view of a PriceCharting wishlist with Remove, Move, Select and Exclude buttons on each row" style="width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block">
  </div>

  <div style="position: absolute; left: 690px; top: 128px; width: 660px; height: 397px; border-radius: 18px; overflow: hidden; background: #ffffff; border: 6px solid #ffffff; box-shadow: 0 30px 70px rgba(0,30,70,0.45); transform: rotate(-3deg)">
    <img src="/_blob/97e84b7fd65373e00b0cae348c36439e" alt="Grid view of a PriceCharting wishlist showing large card images, prices, and Select, Exclude, Move to collection and Remove buttons" style="width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block">
  </div>

  

  <div style="position: absolute; left: 72px; top: 64px; width: 560px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; align-items: center; gap: 20px">
      <img src="/_blob/52dd5bc4e0e4524552c3eb91e88ef473" alt="Wishlist+ icon" style="width: 88px; height: 88px; display: block; border-radius: 20px; box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 12px 28px rgba(0,30,70,0.3)">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 52px; font-weight: 800; letter-spacing: -1.5px; line-height: 1">Wishlist<span style="color: {{green}}; text-shadow: 0 0 1px rgba(0,0,0,0.15)">+</span></div>
        <div style="font-size: 20px; font-weight: 600; line-height: 1.3">for PriceCharting</div>
      </div>
    </div>

    

    <p style="margin: 0; font-size: 20px; font-weight: 500; line-height: 1.45; max-width: 520px">Browse in a card grid, search, track totals and move cards to your collection in two clicks.</p>

    
  </div>

  <div style="position: absolute; left: 72px; bottom: 26px; font-size: 14px; font-weight: 600">Independent extension. Not affiliated with PriceCharting.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"blue":{"editor":"color","default":"#0076DF","options":["#0076DF","#0068C4","#005DB8"]},"green":{"editor":"color","default":"#5DAE3A","options":["#5DAE3A","#6CC04A","#4E9A30"]},"$preview":{"width":1400,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      blue: this.props.blue ?? '#0076DF',
      green: this.props.green ?? '#5DAE3A'
    };
  }
}
</script>
</body>
</html>
