<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wishlist+ small promo tile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#e6f1fc}
</style>
</helmet>
<div style="width: 440px; height: 280px; position: relative; overflow: hidden; box-sizing: border-box; background: {{blue}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ffffff">

  <div aria-hidden="true" style="position: absolute; left: 236px; top: -70px; width: 330px; height: 420px; border-radius: 48px; background: #0A6AC6; transform: rotate(-12deg)"></div>

  <div style="position: absolute; left: 238px; top: 62px; width: 250px; height: 150px; border-radius: 10px; overflow: hidden; background: #ffffff; border: 4px solid #ffffff; box-shadow: 0 16px 36px rgba(0,30,70,0.45); transform: rotate(-4deg)">
    <img src="/_blob/97e84b7fd65373e00b0cae348c36439e" alt="Grid view of a PriceCharting wishlist showing large card images and prices" style="width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block">
  </div>

  <div style="position: absolute; left: 26px; top: 34px; width: 206px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <img src="/_blob/52dd5bc4e0e4524552c3eb91e88ef473" alt="Wishlist+ icon" style="width: 58px; height: 58px; display: block; border-radius: 14px; box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 8px 18px rgba(0,30,70,0.3)">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 38px; font-weight: 800; letter-spacing: -1px; line-height: 1">Wishlist<span style="color: {{green}}; text-shadow: 0 0 1px rgba(0,0,0,0.15)">+</span></div>
        <div style="font-size: 15px; font-weight: 600; line-height: 1.3">for PriceCharting</div>
      </div>
    </div>
    <p style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.35">Your whole wishlist: sorted, searchable and totaled.</p>
  </div>

  <div style="position: absolute; left: 26px; bottom: 12px; font-size: 11px; font-weight: 600">Not affiliated with PriceCharting.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"blue":{"editor":"color","default":"#0076DF","options":["#0076DF","#0068C4","#005DB8"]},"green":{"editor":"color","default":"#5DAE3A","options":["#5DAE3A","#6CC04A","#4E9A30"]},"$preview":{"width":440,"height":280}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      blue: this.props.blue ?? '#0076DF',
      green: this.props.green ?? '#5DAE3A'
    };
  }
}
</script>
</body>
</html>
